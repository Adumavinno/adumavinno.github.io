<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A5A">
<title>VINNO VF8 All New</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#FFFFFF;--card:#F4F6FA;--soft:#E9EDF4;--ink:#121A33;--muted:#667085;--line:#E7EAF0;
--brand:#1E2A5A;--olive:#2459D6;--on:#FFFFFF;--tint:#E8EEFF;--gold:#F59E0B;
--red:#C2392E;--amber:#B07A0A;--green:#2D7A43;--blue:#2E66A6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0D1120;--card:#161B2E;--soft:#1F2640;--ink:#E8ECF7;--muted:#A0A8C0;--line:#2A3250;
--brand:#0A0E1C;--olive:#7FA6FF;--on:#0D1120;--tint:#1C2A52;--gold:#FBBF24;
--red:#F07A6E;--amber:#E5B550;--green:#72C98A;--blue:#7DABE6}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--olive)}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* Header + top menu */
.head{background:var(--card)}
.head .wrap{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:6px}
.head .logo{height:46px;width:auto;flex:none;display:block}
.av{display:block;width:100%;height:100%}
.head h1{margin:0;font:800 20px/1.05 'Be Vietnam Pro',sans-serif;flex:1;color:var(--ink)}
.head h1 small{display:block;font:600 11.5px/1.2 'Be Vietnam Pro',sans-serif;color:var(--muted);letter-spacing:.06em}
.h h2,.dh h2,.welcome h2,.pf h2,.tile b,.levelup h3{font-family:'Be Vietnam Pro',sans-serif}
.ico{display:inline-block;flex:none;width:var(--s,40px);height:var(--s,40px);background:url(https://adumavinno.github.io/icons.webp) no-repeat;background-size:500% 400%}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600;max-width:55%}
.me .av{width:30px;height:30px}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.menu .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:4px;padding-bottom:0}
.menu a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;line-height:1.2;text-align:center;border-bottom:3px solid transparent}
.menu a .ico{--s:34px;transition:transform .15s}
.menu a[aria-current="page"] .ico{transform:scale(1.12)}
.menu a[aria-current="page"]{color:var(--olive);border-bottom-color:var(--olive)}
main{padding:14px 0 calc(96px + env(safe-area-inset-bottom,0px))}

/* Basics */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 42px 0 44px;font-size:16px;outline:none}
.search input:focus{border-color:var(--olive)}
.search>svg{position:absolute;left:14px;top:13px;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search .x{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:20px}
.h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.h h2{margin:0;font-size:16px;font-weight:700}
.h button,.h a{border:0;background:none;color:var(--olive);font-weight:600;font-size:14px;padding:4px 0;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.c-red{--c:var(--red)}.c-amber{--c:var(--amber)}.c-green{--c:var(--green)}.c-blue{--c:var(--blue)}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--olive);color:var(--on);font-weight:600;font-size:15px;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.note{font-size:13px;color:var(--muted)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;background:var(--card);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:112px;justify-content:center;box-shadow:0 2px 0 var(--line)}
.tile:active{transform:translateY(1px);box-shadow:none}
.tile .i{font-size:34px;line-height:1.3}
.tile .ico{--s:56px}
.tile b{font-size:14.5px;font-weight:700;line-height:1.15}
.tile small{font-size:12px;color:var(--muted)}
.tile.hot{position:relative}
.tile.hot::after{content:attr(data-red);position:absolute;top:8px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Error rows */
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.ic .ico{--s:44px}
.row .tx{flex:1;min-width:0}
.row .d{margin:0;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.row .n{flex:none;text-align:center;min-width:40px}
.row .n b{display:block;font-size:17px;line-height:1.1}
.row .n small{font-size:11px;color:var(--muted)}
.mine{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--tint);color:var(--olive)}
.more{display:block;width:100%;border:0;background:none;color:var(--olive);font-weight:600;padding:14px;border-top:1px solid var(--line)}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;height:54px;padding:0 22px;border-radius:27px;border:0;background:var(--olive);color:var(--on);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(30,40,10,.3);display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}
.back-chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--tint);color:var(--olive);font-weight:600;font-size:14px;height:36px;padding:0 14px;border-radius:999px;margin-bottom:12px}

/* Screens */
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.screen .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.back{border:0;background:none;display:flex;align-items:center;gap:2px;color:var(--olive);font-weight:600;padding:10px 10px 10px 0}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.dh{display:flex;gap:12px;align-items:flex-start;margin:4px 0 14px}
.dh .ic{width:60px;height:60px;font-size:30px}
.dh .ic .ico{--s:60px}
.dh h2{margin:0;font-size:19px;line-height:1.38;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:flex;align-items:center;gap:7px;font-size:15px;margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.card p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.card .sec+.sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.warn{background:color-mix(in srgb,var(--red) 12%,var(--card));border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.warn b{color:var(--red)}
details.fold{background:var(--card);border-radius:16px;margin-bottom:12px}
details.fold>summary{list-style:none;padding:15px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span{font-weight:500;color:var(--muted);font-size:13px;margin-left:auto}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-top:-4px}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.fold .in{padding:0 16px 16px;white-space:pre-line;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;white-space:normal}
.tl li{padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0;padding-top:0}
.tl time{font-weight:600;font-size:13px;color:var(--olive)}
.tl p{margin:2px 0 0;font-size:14.5px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.dock .r{display:flex;align-items:center;gap:12px}
.dock .r p{margin:0;flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.dock .r p b{color:var(--ink);display:block;font-size:14.5px}
.vers{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}

/* Forms */
.field{margin-bottom:16px}
.field>label,.field>.lb{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 13px;font-size:16px;outline:none}
.inp:focus{border-color:var(--olive)}
textarea.inp{min-height:100px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.pick button .i{font-size:30px}
.pick button .ico{--s:52px}
.pick button[aria-pressed="true"]{border-color:var(--olive);background:var(--tint)}
.paints{display:flex;flex-wrap:wrap;gap:12px}
.paint{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);width:56px;padding:0}
.paint i{width:40px;height:40px;border-radius:50%;background:var(--p);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.paint[aria-pressed="true"]{color:var(--ink);font-weight:600}
.paint[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--olive)}
.dupes{background:color-mix(in srgb,var(--amber) 13%,var(--card));border-radius:12px;padding:12px 14px;margin:-6px 0 16px;font-size:13.5px}
.dupes a{display:block;padding:6px 0 0;color:var(--ink)}
.copybox{background:var(--soft);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13.5px;margin:12px 0;max-height:240px;overflow:auto}

/* Onboarding */
.welcome{text-align:center;padding:24px 0 8px}
.welcome .logo{width:200px;height:auto;margin:0 auto 6px;display:block}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:6px auto 0;max-width:320px;color:var(--muted);font-size:14px}

/* Profile */
.pf{text-align:center;padding:8px 0 4px}
.pf .avw{width:120px;height:120px;margin:0 auto}
.pf .chg{margin-top:8px}
.pf h2{margin:8px 0 2px;font-size:21px}
.lvl{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--olive);font-weight:700;border-radius:999px;padding:5px 12px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--gold))}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.nums div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.nums b{display:block;font-size:20px}
.nums small{font-size:12px;color:var(--muted)}
.ladder li,.board li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ladder,.board{list-style:none;margin:0;padding:0}
.ladder li:first-child,.board li:first-child{border-top:0}
.ladder .e{font-size:24px;width:32px;text-align:center}
.ladder .t{flex:1}
.ladder .t b{display:block;font-size:14.5px}
.ladder .t small{color:var(--muted);font-size:12.5px}
.ladder .p{font-size:12.5px;color:var(--muted);font-weight:600}
.ladder li.on .t b{color:var(--olive)}
.ladder li.lock{opacity:.45}
.board .rk{width:24px;font-weight:700;color:var(--muted);text-align:center}
.board .nm{flex:1;font-weight:500}
.board .pt{font-weight:700}
.earn{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.earn b{color:var(--olive)}

/* Checklist & Q&A */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:10px;height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ring{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px 16px}
.ring svg{width:56px;height:56px;flex:none}
.ring b{font-size:16px}
.ck{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line);align-items:flex-start}
.ck:first-child{border-top:0}
.ck input{width:24px;height:24px;margin:0;accent-color:var(--olive);flex:none}
.ck label{font-weight:500;display:block;line-height:1.4}
.ck.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ck .r{font-size:12.5px;margin-top:3px}
.ck .r a{text-decoration:none;font-weight:600;margin-right:10px}
details.qa{border-top:1px solid var(--line)}
details.qa:first-child{border-top:0}
details.qa summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:12px;align-items:center;font-weight:500;line-height:1.4}
details.qa summary::-webkit-details-marker{display:none}
details.qa .a{padding:0 14px 16px 70px;white-space:pre-line;overflow-wrap:anywhere;font-size:14.5px}
details.qa .by{font-size:12px;color:var(--muted);margin-top:10px}
details.qa[open] summary{color:var(--olive)}
.unans{background:color-mix(in srgb,var(--gold) 15%,var(--card));border-radius:16px;margin-bottom:14px}
.unans>summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.unans>summary::-webkit-details-marker{display:none}
.unans .q{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.unans .q p{margin:0;font-size:14.5px}

/* Accessories */
.pk{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.pk:first-child{border-top:0}
.pk .tx{flex:1;min-width:0}
.pk .nm{font-weight:500;line-height:1.35}
.pk .nt{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Search */
mark{background:color-mix(in srgb,var(--gold) 38%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.snip{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.also{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.also button{border:1px dashed var(--line);background:var(--card);border-radius:999px;height:34px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--olive);display:flex;align-items:center;gap:6px}
.also button .ico{--s:24px}
.approx{font-size:13px;color:var(--muted);margin:-4px 2px 10px}

/* Header actions */
.hbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:20px;padding:0}
.me .av{border-radius:50%;overflow:hidden}
.avw{display:block;border-radius:50%;overflow:hidden;background:var(--tint);flex:none}
.avw .ico{--s:100%;width:100%;height:100%}
.avw img,.avw svg{display:block;width:100%;height:100%;object-fit:cover}
.install{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2459D6,#1E2A5A);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;text-decoration:none;border:0;width:100%;text-align:left}
.install b{display:block;font-size:15px}
.install small{font-size:12.5px;opacity:.85}
.install .go{margin-left:auto;background:#fff;color:#1E2A5A;font-weight:700;border-radius:10px;padding:8px 12px;font-size:13.5px;flex:none}
.install .x2{background:none;border:0;color:#fff;opacity:.7;font-size:20px;padding:0 2px;flex:none}

/* Avatar picker */
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.avgrid button{border:2px solid transparent;background:var(--card);border-radius:18px;padding:8px;aspect-ratio:1;display:grid;place-items:center}
.avgrid button[aria-pressed="true"]{border-color:var(--olive);background:var(--tint)}
.avgrid .avw{width:100%;height:100%}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:16px;padding:14px;font-weight:600;color:var(--olive);cursor:pointer;margin-bottom:16px;background:var(--card)}
.upl input{display:none}

/* Leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:8px 0 14px}
.pod{text-align:center;background:var(--card);border-radius:18px 18px 10px 10px;padding:12px 6px 10px;position:relative}
.pod .avw{width:64px;height:64px;margin:0 auto 6px}
.pod.p1{padding-top:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 28%,var(--card)),var(--card))}
.pod.p1 .avw{width:84px;height:84px;box-shadow:0 0 0 4px var(--gold)}
.pod .md{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:26px}
.pod b{display:block;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pt{font:800 20px/1.1 'Be Vietnam Pro',sans-serif;color:var(--olive)}
.pod small{display:block;font-size:11.5px;color:var(--muted)}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.lb{list-style:none;margin:0;padding:0}
.lb li:first-child{border-top:0}
.lb .rk{width:26px;text-align:center;font-weight:800;color:var(--muted)}
.lb .avw{width:42px;height:42px}
.lb .nm{flex:1;min-width:0}
.lb .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{font-size:12px;color:var(--muted)}
.lb .pt{font:800 18px/1 'Be Vietnam Pro',sans-serif;text-align:right}
.lb .pt small{display:block;font:500 11px 'Be Vietnam Pro',sans-serif;color:var(--muted)}
.lb li.isme,.pod.isme{outline:2px solid var(--olive);outline-offset:-2px}
.myrank{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.myrank .avw{width:38px;height:38px}
.mini{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:14px;border:0;width:100%;text-align:left}
.mini .stack{display:flex}
.mini .stack .avw{width:34px;height:34px;box-shadow:0 0 0 2px var(--card)}
.mini .stack .avw+.avw{margin-left:-10px}
.mini b{display:block;font-size:14.5px}
.mini small{font-size:12.5px;color:var(--muted)}

.veil{position:fixed;inset:0;z-index:40;background:rgba(10,12,6,.45)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,12,6,.55);padding:24px}
.levelup>div{background:var(--card);border-radius:24px;padding:28px 24px;text-align:center;max-width:320px;animation:pop .35s ease-out}
.levelup .e{font-size:56px;line-height:1}
.levelup .ico{--s:96px;margin:0 auto}
.levelup h3{margin:8px 0 4px;font-size:20px}

.head,.menu,body::before{background:var(--bg)}
.head .wrap{padding-top:10px;padding-bottom:4px;gap:8px}

.head h1 small{font-size:12px;letter-spacing:0;font-weight:500;margin-top:2px}
.hbtn{border:0;background:var(--card);border-radius:50%;width:40px;height:40px;font-size:19px}
.me{border:0;background:var(--card);padding:4px 12px 4px 4px}
.menu{border-bottom:1px solid var(--line)}
.menu .wrap{gap:0;padding-top:2px;grid-template-columns:repeat(5,1fr)}
.menu a{font-size:12.5px;white-space:nowrap}
.menu a{position:relative;gap:4px;padding:6px 2px 10px;font-size:13px;border-bottom:0;color:var(--muted)}
.menu a .ico{--s:30px}

.menu a[aria-current="page"] .ico{transform:scale(1.08)}
.menu a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-1px;width:32px;height:3px;border-radius:3px 3px 0 0;background:var(--olive);transform:translateX(-50%)}
main{padding-top:16px}
.search input{border:1.5px solid transparent;background:var(--card);height:50px;border-radius:16px}

.tile .ico{--s:54px}

.list,.card,details.fold,.mini,.stat,.nums div,.ring{border-radius:20px}
.row{padding:13px 16px}
.btn{border-radius:14px}

.dock{background:var(--bg)}

.also button{border:0;background:var(--tint)}
.install{background:var(--brand);border-radius:20px}

.avgrid button{background:var(--card)}
.upl{background:var(--bg)}
.pod{border-radius:20px 20px 12px 12px}

.unans{border-radius:20px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st}

ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--olive);color:#fff;font-weight:700;font-size:13.5px;display:grid;place-items:center}
ul.keep{margin:0;padding:0 0 0 18px}
ul.keep li{margin:0 0 8px;line-height:1.5}
ul.keep li:last-child{margin-bottom:0}

.gic svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.g-sac{--gc:#15803D}.g-adas{--gc:#7C3AED}.g-tiennghi{--gc:#B45309}.g-ketnoi{--gc:#0E7490}.g-suco{--gc:#DC2626}

.li{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);display:inline-grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--c);flex:none;vertical-align:middle}
.li svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.li text{fill:currentColor;stroke:none;text-anchor:middle;font-family:'Be Vietnam Pro',sans-serif;font-weight:800}
:root[data-theme="dark"] .li{background:color-mix(in srgb,var(--c) 22%,var(--card));filter:brightness(1.35)}
.tile .li{--s:52px}.ic .li{--s:44px}.dh .ic .li{--s:60px}.pick button .li{--s:50px}.levelup .li{--s:88px;margin:0 auto 6px}.empty .li{margin-bottom:6px}
.menu .li{--s:30px;background:none;color:inherit;filter:none;transition:transform .15s}
.menu .li svg{width:88%;height:88%}

.chip .li,.also .li{--s:22px;background:none;margin-right:-2px}
.chip .li svg,.also .li svg{width:90%;height:90%}
.chip[aria-pressed="true"] .li{color:inherit;filter:none}
.unans summary .li{--s:40px}
.install .li{background:rgba(255,255,255,.16);color:#fff;filter:none}
[data-person]{cursor:pointer}
.lb li[data-person]:active,.pod[data-person]:active{background:var(--soft)}
.h .note{font-size:12.5px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

 if(!since) (D.rv||[]).forEach(x => names(x.who).forEach(n => add(n,'rv',2)));

  if(r){ ['metoo','report','answer','ask','share','rv'].forEach(f => r[f] = (r[f]||0) + h[f]); r.points += h.points; }

 });

const SYNMAP = new Map(); SYN.forEach(g => g.forEach(w => SYNMAP.set(w, g)));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function lev1(a, b){ // true nếu a, b sai khác tối đa 1 ký tự
 if(a === b) return true; const la = a.length, lb = b.length; if(Math.abs(la-lb) > 1) return false;
 let i = 0, j = 0, d = 0;
 while(i < la && j < lb){ if(a[i] === b[j]){ i++; j++; continue; } if(++d > 1) return false; if(la > lb) i++; else if(lb > la) j++; else { i++; j++; } }
 return d + (la-i) + (lb-j) <= 1;
}
function parseQuery(q){
 const raw = String(q||'').toLowerCase().trim(); if(!raw) return null;
 let f = ' ' + nf(raw).replace(/\s+/g,' ').trim() + ' ';
 const rawWords = raw.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
 const terms = [];
 // cụm từ đồng nghĩa nhiều chữ, dài trước
 [...SYNMAP.keys()].filter(k => k.includes(' ')).sort((a,b) => b.length-a.length).forEach(k => {
  if(f.includes(' '+k+' ')){ terms.push({alts:SYNMAP.get(k), main:k, raw:null}); f = f.replace(' '+k+' ', ' '); }
 });
 let words = f.trim().split(' ').filter(Boolean);
 const keep = words.filter(w => !STOP.has(w)), stops = words.filter(w => STOP.has(w));
 if(keep.length || terms.length) words = keep; else stops.length = 0;
 words.forEach(w => {
  const rw = rawWords.find(x => nf(x).trim() === w) || null;
  terms.push({alts: SYNMAP.get(w) || [w], main:w, raw: rw && rw !== w ? rw : null});
 });
 if(!terms.length) return null;
 terms.forEach(t => t.res = t.alts.map(a => ({a, syn: a !== t.main, ex: new RegExp('(?:^|\\s)'+reEsc(a).replace(/ /g,'\\s+')+'(?=\\s|$)'), pre: new RegExp('(?:^|\\s)'+reEsc(a).replace(/ /g,'\\s+')), sub: a.length >= 4 ? new RegExp(reEsc(a)) : null})));
 return {terms, stops: stops.map(w => new RegExp('(?:^|\\s)'+w+'(?=\\s|$)')), phrase: nf(raw).replace(/\s+/g,' ').trim()};
}
function termScore(t, F){ // F: [{n: chuỗi đã chuẩn hóa, r: chữ gốc thường, w: trọng số, fz: có cho gõ sai}]
 let best = 0;
 for(const f of F){
  for(const x of t.res){
   let s = 0;
   if(x.ex.test(f.n)) s = 1; else if(x.a.length >= 2 && x.pre.test(f.n)) s = x.a.length >= 4 ? .8 : .3; else if(x.sub && x.sub.test(f.n)) s = .45;
   else if(f.fz && x.a.length >= 5 && !x.a.includes(' ')) { if(f.n.split(/\s+/).some(w => w.length >= 4 && lev1(w, x.a))) s = .4; }
   if(!s) continue;
   if(x.syn) s *= .85;
   if(t.raw && !x.syn) s *= f.r.includes(t.raw) ? 1.2 : .55; // gõ có dấu: ưu tiên đúng dấu (đèn ≠ đen)
   best = Math.max(best, s * f.w);
  }
 }
 return best;
}
function searchItems(items, q, fieldsOf){
 const Q = typeof q === 'string' ? parseQuery(q) : q; if(!Q) return null;
 const scored = items.map(it => {
  const F = it._sf || (it._sf = fieldsOf(it).filter(x => x[0]).map(([txt,w,fz]) => ({n:' '+nf(txt)+' ', r:String(txt).toLowerCase(), w, fz:!!fz})));
  const per = Q.terms.map(t => termScore(t, F));
  const hit = per.filter(s => s > 0).length;
  let score = per.reduce((a,b) => a+b, 0);
  if(Q.phrase.includes(' ') && F[0] && F[0].n.includes(' '+Q.phrase)) score += 4;
  if(hit && F[0]){
   Q.terms.forEach(t => { const c = F[0].n.split(t.res[0].ex).length - 1; if(c > 1) score += Math.min(c-1, 3) * .5; }); // nhắc nhiều lần → liên quan hơn
   if(Q.stops) Q.stops.forEach(re => { if(re.test(F[0].n)) score += .3; }); // chữ phụ (không, vào…) chỉ để xếp hạng
  }
  return {it, score, hit};
 });
 let res = scored.filter(x => x.hit === Q.terms.length), approx = false;
 if(!res.length && Q.terms.length > 1){ const need = Math.ceil(Q.terms.length/2); res = scored.filter(x => x.hit >= need); approx = res.length > 0; }
 res.sort((a,b) => b.score - a.score);
 return {list: res.map(x => x.it), score: new Map(res.map(x => [x.it, x.score])), approx, Q};
}
function hl(text, Q){ // tô sáng chữ khớp, giữ nguyên dấu
 text = String(text ?? ''); if(!Q) return esc(text);
 const n = nf(text), marks = new Array(text.length).fill(false);
 Q.terms.forEach(t => t.res.forEach(x => {
  const re = new RegExp('(^|\\s)(' + reEsc(x.a).replace(/ /g,'\\s+') + ')', 'g'); let m;
  while((m = re.exec(n))){ let s = m.index + m[1].length, e = s + m[2].length; while(e < n.length && n[e] !== ' ') e++; for(let k = s; k < e; k++) marks[k] = true; if(re.lastIndex === m.index) re.lastIndex++; }
 }));
 let out = '', on = false;
 for(let k = 0; k < text.length; k++){ if(marks[k] !== on){ out += on ? '</mark>' : '<mark>'; on = marks[k]; } out += esc(text[k]); }
 return out + (on ? '</mark>' : '');
}
function snippet(text, Q, len){ // đoạn ngắn quanh chỗ khớp đầu tiên
 text = String(text ?? ''); if(!text || !Q) return '';
 const n = nf(text); let pos = -1;
 Q.terms.forEach(t => t.res.forEach(x => { const m = new RegExp('(^|\\s)' + reEsc(x.a).replace(/ /g,'\\s+')).exec(n); if(m && (pos < 0 || m.index < pos)) pos = m.index + m[1].length; }));
 if(pos < 0) return '';
 len = len || 110; const s = Math.max(0, pos - 35), e = Math.min(text.length, s + len);
 return (s > 0 ? '…' : '') + hl(text.slice(s, e), Q) + (e < text.length ? '…' : '');
}
const errFields = e => [[e.desc,6,1],[(GROUPS[e.g]||[])[1]||e.g,3],[e.tmp,2.5,1],[e.fix,2.5,1],[e.ctx,2],[e.where,1],[e.ver,1],[e.note,1]];
const qaFields = q => [[q.q,6,1],[q.topic,3],[q.a,2,1],[q.note,1]];
const pkFields = p => [[p.name,6,1],[p.cat,4],[p.note,2],[p.raw,1]];
const termAllIn = (txt, Q) => Q.terms.every(t => termScore(t, [{n:' '+nf(txt)+' ', r:String(txt).toLowerCase(), w:1}]) > 0);
function errSnip(e, Q){ // nếu tiêu đề không khớp, cho xem chỗ khớp
 if(!Q || Q.terms.every(t => termScore(t, [{n:' '+nf(e.desc)+' ', r:e.desc.toLowerCase(), w:1}]) > 0)) return '';
 for(const [txt] of [[e.tmp],[e.fix],[e.ctx],[e.note]]){ const s = snippet(txt, Q); if(s) return s; }
 return '';
}

function readPhoto(file){
 return new Promise((res, rej) => {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { const S2 = 96, c = document.createElement('canvas'); c.width = c.height = S2; const x = c.getContext('2d');
   const m = Math.min(img.width, img.height); x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S2, S2);
   URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72)); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
  img.src = url;
 });
}

 const PQ = S.pkQ ? parseQuery(S.pkQ) : null;
 const item = p => `<div class="pk"><span class="ic" aria-hidden="true">${ico(PKN[p.cat]||'gift')}</span><div class="tx"><div class="nm">${PQ ? hl(p.name, PQ) : esc(p.name)}</div>${p.note||p.raw?`<div class="nt">${PQ ? hl(p.note||p.raw, PQ) : esc(p.note||p.raw)}</div>`:''}</div>${p.links.length?`<a class="btn sm" href="${esc(p.links[0])}" target="_blank" rel="noopener noreferrer">Mua</a>`:''}</div>`;
 if(!S.pkQ && !S.pkCat){
  const big = cats.filter(c => cnt[c] >= 2), small = cats.filter(c => cnt[c] < 2);

   <p class="note" style="margin:14px 2px 0">Link do anh em tự chia sẻ, chưa kiểm chứng. Một số người chia sẻ là bên bán hàng hoặc garage.</p>`;
  return;
 }
 const small = cats.filter(c => cnt[c] < 2);
 const inCat = D.pk.filter(p => !S.pkCat || (S.pkCat==='__other' ? small.includes(p.cat||'Khác') : (p.cat||'Khác')===S.pkCat));
 const psr = S.pkQ ? searchItems(inCat, S.pkQ, pkFields) : null;
 const list = psr ? psr.list : inCat;
 box.innerHTML = `${S.pkCat?`<button class="back-chip" data-act="clearPk">← Các loại đồ chơi</button>`:''}<div class="list">${list.length ? list.map(item).join('') : `<div class="empty">Chưa có món nào khớp.</div>`}</div>`;
}

/* ---- Tab: Hỏi đáp ---- */
let pendingQA = null;
function renderQA(){
 const box = $('#qaBody');
 if(LOADING){ box.innerHTML = `<div class="empty">Đang tải…</div>`; return; }
 const ans = D.qa.filter(isAnswered), cnt = {}; ans.forEach(q => cnt[q.topic] = (cnt[q.topic]||0) + 1);
 const tops = Object.keys(cnt).filter(t => cnt[t] >= 3).sort((a,b) => cnt[b]-cnt[a]);
 $('#qaChips').innerHTML = `<button class="chip" data-tp="" aria-pressed="${!S.qaTopic}">Tất cả</button>` + tops.map(t => `<button class="chip" data-tp="${esc(t)}" aria-pressed="${S.qaTopic===t}">${ico(QAN[t]||'ask',20)}${esc(t)}</button>`).join('');
 const QQ = S.qaQ ? parseQuery(S.qaQ) : null;
 const unAll = D.qa.filter(q => !isAnswered(q));
 const un = QQ ? (searchItems(unAll, QQ, qaFields)||{list:[]}).list : unAll;
 const inTop = ans.filter(q => !S.qaTopic || q.topic===S.qaTopic);
 const qsr = QQ ? searchItems(inTop, QQ, qaFields) : null;
 const list = qsr ? qsr.list : inTop;
 box.innerHTML = `${un.length && !S.qaTopic ? `<details class="unans" ${S.qaQ?'open':''}><summary>${ico('ask',40)}${un.length} câu đang chờ anh em trả lời<span class="note" style="margin-left:auto">+3đ</span></summary>${un.map(q => `<div class="q"><p>${esc(q.q)}</p><button class="btn sm" data-act="answer" data-id="${q.id}">Trả lời</button></div>`).join('')}</details>` : ''}
  <div class="list">${list.length ? list.map(q => `<details class="qa" id="qa-${q.id}"><summary><span class="ic">${qIcon(q.topic)}</span><span>${QQ ? hl(q.q, QQ) : esc(q.q)}${QQ && !termAllIn(q.q, QQ) ? `<span class="snip">${snippet(q.a, QQ) || snippet(q.note, QQ)}</span>` : ''}</span></summary><div class="a">${linkify(breakDates(q.a))}${q.note?`\n\n${linkify(breakDates(q.note))}`:''}<div class="by">${[q.who,q.date].filter(Boolean).map(esc).join(', ')}</div></div></details>`).join('') : `<div class="empty">Chưa có câu hỏi nào khớp.</div>`}</div>`;
 if(pendingQA){ const d = $('#qa-'+pendingQA); pendingQA = null; if(d){ d.open = true; requestAnimationFrame(() => d.scrollIntoView({block:'center'})); } }
}

 const row = x => `<a class="row" href="#hd-${x.id}"><span class="ic">${gIco(x)}</span><span class="tx"><p class="d">${Q ? hl(x.t, Q) : esc(x.t)}</p><span class="m">${Q ? hl(x.s, Q) : esc(x.s)}</span></span><span class="chev" aria-hidden="true">›</span></a>`;
 if(sr){ box.innerHTML = sr.list.length ? `<div class="h"><h2>Kết quả cho “${esc(S.hdQ)}”</h2></div><div class="list">${sr.list.map(row).join('')}</div>` : `<div class="list"><div class="empty">Chưa có hướng dẫn cho “${esc(S.hdQ)}”. Thử từ khác, hoặc hỏi anh em ở tab Hỏi đáp.</div></div>`; return; }
 box.innerHTML = `<p class="note" style="margin:0 2px 4px">Tóm tắt từ Hướng dẫn sử dụng VF 8 All New 2026 của VinFast, kèm kinh nghiệm thực tế của anh em trong hội.</p>
  ${HDG.map(([g,e,name]) => `<div class="h"><h2>${e} ${name}</h2></div><div class="list">${GUIDE.filter(x => x.g===g).map(row).join('')}</div>`).join('')}
  <p class="note" style="margin:16px 2px 0">Bản đầy đủ: <a href="${HDSD_URL}" target="_blank" rel="noopener">HDSD chính hãng VinFast</a></p>`;
}
function renderGuide(id){
 const x = GUIDE.find(g => g.id === id);
 if(!x){ openScreen(`<div class="nav">${backBtn}</div><div class="empty">Không tìm thấy hướng dẫn này.</div>`); return; }
 let rel = '';
 if(!LOADING && D.errs){
  const se = searchItems(D.errs, x.q, errFields), sq = searchItems(D.qa.filter(isAnswered), x.q, qaFields);
  const er = se ? se.list.filter(e => termAllIn(e.desc, se.Q)).slice(0,3) : [], qa = sq ? sq.list.filter(q => termAllIn(q.q, sq.Q)).slice(0,3) : [];
  if(er.length || qa.length) rel = `<div class="h"><h2>👥 Anh em đã gặp, đã hỏi</h2></div><div class="list">${er.map(e => errRow(e)).join('')}${qa.map(q => `<a class="row" href="#hoi-dap" data-qa="${q.id}"><span class="ic">${qIcon(q.topic)}</span><span class="tx"><p class="d">${esc(q.q)}</p><span class="m">Hỏi đáp · ${esc(q.topic||'')}</span></span></a>`).join('')}</div>`;
 }
 openScreen(`<div class="nav">${backBtn}</div>
  <div class="dh"><span class="ic">${gIco(x,60)}</span><h2>${esc(x.t)}<br><small class="note" style="font-weight:500">${esc(x.s)}</small></h2></div>
  <div class="card"><h3>📘 Cách làm</h3><ol class="steps">${x.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
  ${x.keep.length ? `<div class="card"><h3>📌 Cần nhớ</h3><ul class="keep">${x.keep.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
  ${x.tips.length ? `<div class="card tipcard"><h3>💬 Kinh nghiệm anh em</h3><ul class="keep">${x.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
  ${rel}
  <p class="note" style="margin-top:16px">Nguồn: tóm tắt từ HDSD VF 8 All New 2026 của VinFast. Kinh nghiệm anh em là thông tin cộng đồng, không phải hướng dẫn chính hãng. <a href="${HDSD_URL}" target="_blank" rel="noopener">Xem HDSD đầy đủ</a></p>`);
}


function contribOf(name){
 const k = nameKey(name), C = {report:[], metoo:[], answer:[], ask:[], share:[], rv:[]};
 const has = who => whoNames(who).findIndex(n => n.k === k);
 (D.errs||[]).forEach(e => { const i = has(e.who); if(i === 0) C.report.push(e); else if(i > 0) C.metoo.push(e); });
 (D.qa||[]).forEach(q => { const n = whoNames(q.who).find(n => n.k === k); if(n) (n.ask ? C.ask : C.answer).push(q); });
 (D.pk||[]).forEach(x => { if(has(x.who) >= 0) C.share.push(x); });
 (D.rv||[]).forEach(x => { if(has(x.who) >= 0) C.rv.push(x); });
 return C;
}
function renderPerson(name){
 if(!LB){ openScreen(`<div class="nav">${backBtn}</div><div class="empty">Đang tải…</div>`); loadBoard().then(() => location.hash.startsWith('#nguoi-') && renderPerson(name)); return; }
 const r = (LB.all||[]).find(x => nameKey(x.name) === nameKey(name)) || {name, points:0, av:'car'};
 const C = contribOf(name), lv = levelOf(r.allPoints ?? r.points), l = LEVELS[lv], app = r.app || {};
 const qaRow = q => `<a class="row" href="#hoi-dap" data-qa="${q.id}"><span class="ic">${qIcon(q.topic)}</span><span class="tx"><p class="d">${esc(q.q)}</p><span class="m">${esc(q.topic||'Hỏi đáp')}</span></span></a>`;
 const pkRow = x => `<a class="row" href="#phu-kien" data-pkq="${esc(x.name)}"><span class="ic">${ico(PKN[x.cat]||'gift')}</span><span class="tx"><p class="d">${esc(x.name)}</p><span class="m">${esc(x.cat||'Phụ kiện')}</span></span></a>`;
 const sec = (ic, title, pts, list, row, id) => list.length ? `<div class="h"><h2>${ic} ${title} · ${list.length}</h2><span class="note" style="white-space:nowrap">+${pts}đ/mục</span></div><div class="list" id="ps-${id}">${list.slice(0, 8).map(row).join('')}${list.length > 8 ? `<button class="more" data-act="psMore" data-id="${id}">Xem thêm ${list.length - 8}</button>` : ''}</div>` : '';
 PS = {C, qaRow, pkRow};
 const appLine = [app.report?`🆕 ${app.report} lỗi mới`:'', app.answer?`💬 ${app.answer} câu trả lời`:'', app.metoo?`👍 ${app.metoo} lần “Tôi cũng bị”`:'', app.ok?`✅ ${app.ok} lần được duyệt`:''].filter(Boolean);
 const total = C.report.length + C.metoo.length + C.answer.length + C.ask.length + C.share.length + C.rv.length;
 openScreen(`<div class="nav">${backBtn}</div>
  <div class="pf"><span style="display:block;width:96px;height:96px;margin:0 auto">${lbAv(r, 96)}</span><h2>${esc(r.name)}${r.me ? ' (bạn)' : ''}</h2><span class="lvl">${l[1]} ${esc(l[2])}</span><p class="note" style="margin:8px 0 0">${r.allPoints ?? r.points} điểm đóng góp${(LB.all||[]).indexOf(r) >= 0 ? ` · hạng #${LB.all.indexOf(r)+1}` : ''}</p></div>
  ${appLine.length ? `<div class="card" style="margin-top:14px"><h3>📱 Trên app · ${app.points||0} điểm</h3><p>${appLine.join('<br>')}</p></div>` : ''}
  ${sec('🆕','Lỗi đã báo đầu tiên',5,C.report,e => errRow(e),'report')}
  ${sec('💬','Góp trả lời, kinh nghiệm',3,C.answer,qaRow,'answer')}
  ${sec('🎁','Phụ kiện đã chia sẻ',3,C.share,pkRow,'share')}
  ${sec('👍','Lỗi cùng gặp, xác nhận',1,C.metoo,e => errRow(e),'metoo')}
  ${sec('🙋','Câu đã hỏi',1,C.ask,qaRow,'ask')}
  ${C.rv.length ? `<div class="h"><h2>⭐ Góp đánh giá xe · ${C.rv.length}</h2><span class="note" style="white-space:nowrap">+2đ/mục</span></div><div class="card"><p>${C.rv.map(x => esc(x.cat||'Đánh giá chung')).join(', ')}</p></div>` : ''}
  ${!total && !appLine.length ? `<div class="list"><div class="empty">${ico('puzzle',56)}<br>Chưa tìm thấy đóng góp nào của ${esc(r.name)} trong sổ tay.</div></div>` : ''}
  <p class="note" style="margin-top:14px">Đóng góp trong sổ tay được ghép theo tên. Người trùng tên sẽ được tính chung.</p>`);
}
let PS = null;
/* ---- Router ---- */
const TABS = ['loi','luu-y','huong-dan','phu-kien','hoi-dap'];
let navDepth = 0;
function route(){
 const h = decodeURIComponent(location.hash.slice(1));
 if(!L.profile) return renderSignup(false);
 if(h.startsWith('loi-')) return renderDetail(h.slice(4));
 if(h.startsWith('hd-')) return renderGuide(h.slice(3));
 if(h.startsWith('nguoi-')) return renderPerson(h.slice(6));
 if(h==='bao-loi') return renderReport();
 if(h==='ho-so') return renderProfile();
 if(h==='doi-avatar') return renderAvatar();
 if(h==='bang-vang'){ renderBoard(); return loadBoard(); }
 if(h==='sua-ho-so') return renderSignup(true);
 if(h.startsWith('tra-loi-')) return renderAnswer(h.slice(8));
 closeScreen();
 if(TABS.includes(h)) S.tab = h;
 document.querySelectorAll('[data-view]').forEach(s => s.classList.toggle('hidden', s.dataset.view!==S.tab));
 document.querySelectorAll('[data-tab]').forEach(a => a.dataset.tab===S.tab ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
 $('#fab').classList.toggle('hidden', S.tab!=='loi');
 ({'loi':renderLoi,'luu-y':renderLuu,'huong-dan':renderHD,'phu-kien':renderPK,'hoi-dap':renderQA})[S.tab]();
 renderMe(); renderInstall();
}
function go(h){ navDepth++; location.hash = h; }
function back(){ if(navDepth > 0){ navDepth--; history.back(); } else location.hash = S.tab; }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---- Server ---- */
async function api(body){
 const payload = JSON.stringify(Object.assign({device:L.device, name:(L.profile||{}).name||''}, body));
 const j = GAS ? await gas('apiPost', payload) : await (await fetch(API_URL, {method:'POST', body: payload})).json();
 if(!j || !j.ok) throw new Error((j && j.error) || 'Lỗi máy chủ'); return j;
}
async function loadServer(){
 if(!online()){ LOADING = !D.errs.length; return; }
 try{
  const j = await getJSON('data');
  if(!j || j.ok === false) throw new Error((j && j.error) || 'Lỗi máy chủ');
  LOADING = false;
  if(j.errs){
   D = {updated:j.updated, errs:j.errs, qa:j.qa, pk:j.pk, rv:j.rv, groups:j.groups}; prep();
   try{ localStorage.setItem(DKEY, JSON.stringify(D)); }catch(e){}
  }
  EXTRA = j.extra || {}; EXTRA_VER = j.extraVer || {}; ME = j.me || null; BOARD = j.board || [];
  const keepY = scrollY; route(); if(!location.hash.startsWith('#loi-')) scrollTo(0, keepY); checkLevelUp();
  syncProfile(); loadBoard();
 }catch(e){
  LOADING = false;
  if(!D.errs.length) $('#loiBody').innerHTML = `<div class="empty">Không đọc được dữ liệu: ${esc(e.message||e)}. Kiểm tra mạng rồi tải lại trang.</div>`;
  else toast('Đang dùng dữ liệu đã lưu, chưa tải được bản mới');
 }
}
async function refreshMe(){ if(!online()) return checkLevelUp(); try{ const j = await getJSON('data'); if(j && j.me){ ME = j.me; BOARD = j.board||[]; EXTRA = j.extra||EXTRA; } }catch(e){} checkLevelUp(); LB = null; }

/* ---- Events ---- */
let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); S.limit = 20; renderLoi(); }, 150); });
$('#qClear').onclick = () => { $('#q').value=''; S.q=''; renderLoi(); };
['#q','#pkQ','#qaQ','#hdQ'].forEach(s => $(s).addEventListener('keydown', e => { if(e.key === 'Enter') e.target.blur(); }));
let pT, aT;
$('#pkQ').addEventListener('input', e => { clearTimeout(pT); pT = setTimeout(() => { S.pkQ = e.target.value.trim(); renderPK(); }, 150); });
$('#hdQ').addEventListener('input', e => { clearTimeout(aT); aT = setTimeout(() => { S.hdQ = e.target.value.trim(); renderHD(); }, 150); });
$('#qaQ').addEventListener('input', e => { clearTimeout(aT); aT = setTimeout(() => { S.qaQ = e.target.value.trim(); renderQA(); }, 150); });
$('#fab').onclick = () => go('bao-loi');
$('#meBtn').onclick = () => go('ho-so');
$('#lbBtn').onclick = () => go('bang-vang');
$('#instBtn').onclick = () => doInstall();

document.addEventListener('click', async ev => {
 const t = ev.target.closest('button, a, .levelup, [data-person]'); if(!t) return;
 const ds = t.dataset;
 if(ds.act==='closePop'){ if(ev.target===t || t.tagName==='BUTTON') $('#popHost').innerHTML=''; return; }
 if(ds.g){ S.g = ds.g; S.st=''; S.limit=20; return renderLoi(); }
 if(ds.av){ AVPICK = ds.av; return renderAvatar(); }
 if(ds.lbt){ LBTAB = ds.lbt; return renderBoard(); }
 if(ds.person){ return go('nguoi-' + ds.person); }
 if(ds.pkq !== undefined){ ev.preventDefault(); S.pkQ = ds.pkq; S.pkCat=''; $('#pkQ').value = ds.pkq; location.hash = 'phu-kien'; return; }
 if(ds.also){ const q = S.q; if(ds.also==='huong-dan'){ S.hdQ = q; $('#hdQ').value = q; } else if(ds.also==='hoi-dap'){ S.qaQ = q; S.qaTopic=''; $('#qaQ').value = q; } else { S.pkQ = q; S.pkCat=''; $('#pkQ').value = q; } location.hash = ds.also; return; }
 if(ds.st !== undefined){ S.st = ds.st; S.limit=20; return renderLoi(); }
 if(ds.luu){ S.luu = ds.luu; return renderLuu(); }
 if(ds.pc){ S.pkCat = ds.pc; return renderPK(); }
 if(ds.tp !== undefined){ S.qaTopic = ds.tp; return renderQA(); }
 if(ds.pst){ PF.status = ds.pst; return paintPF(); }
 if(ds.pcol){ PF.color = ds.pcol; return paintPF(); }
 if(ds.rg){ DRAFT.rG = DRAFT.rG===ds.rg ? '' : ds.rg; return paintRG(); }
 if(ds.ver !== undefined){ pickVer = ds.ver; const e = D.errs.find(x => x.id===location.hash.slice(5)); if(e) renderDock(e); if(pickVer==='__other') $('#mtOther').focus(); return; }
 if(ds.qa){ ev.preventDefault(); pendingQA = ds.qa; S.qaQ=''; S.qaTopic=''; $('#qaQ').value=''; if(location.hash==='#hoi-dap') route(); else location.hash='hoi-dap'; return; }
 if(t.matches('a[href^="#loi-"]')){ ev.preventDefault(); return go(t.getAttribute('href').slice(1)); }
 const act = ds.act; if(!act) return;
 if(act==='back') return back();
 if(act==='report') return go('bao-loi');
 if(act==='answer') return go('tra-loi-' + ds.id);
 if(act==='editProfile') return go('sua-ho-so');
 if(act==='pickAv'){ AVPICK = null; return go('doi-avatar'); }
 if(act==='openBoard') return go('bang-vang');
 if(act==='psMore' && PS){ const id = t.dataset.id, row = {report:e => errRow(e), metoo:e => errRow(e), answer:PS.qaRow, ask:PS.qaRow, share:PS.pkRow}[id]; $('#ps-'+id).innerHTML = PS.C[id].map(row).join(''); return; }
 if(act==='install') return doInstall();
 if(act==='theme'){ const d = document.documentElement.dataset.theme !== 'dark'; if(d) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme; try{ localStorage.setItem('vf8olive.theme', d ? 'dark' : 'light'); }catch(e){} toast(d ? 'Đã bật giao diện tối' : 'Đã bật giao diện sáng'); document.querySelectorAll('[data-act=theme]').forEach(b => b.textContent = d ? '☀️ Chuyển giao diện sáng' : '🌙 Chuyển giao diện tối (lái đêm)'); return; }
 if(act==='saveAv'){ L.profile.av = AVPICK || 'car'; saveLocal(); AVPICK = null; toast('Đã đổi avatar'); renderMe(); syncProfile(); LB = null; return back(); }
 if(act==='allErr'){ S.g='*'; return renderLoi(); }
 if(act==='clearG'){ S.g=''; S.st=''; return renderLoi(); }
 if(act==='clearPk'){ S.pkCat=''; return renderPK(); }
 if(act==='sort'){ S.sort = S.sort==='n' ? 'new' : 'n'; return renderLoi(); }
 if(act==='more'){ S.limit += 20; return renderLoi(); }
 if(act==='ckReset'){ if(confirm('Bỏ hết các mục đã đánh dấu?')){ L.check = {}; saveLocal(); renderLuu(); } return; }
 if(act==='saveProfile'){
  PF.name = $('#pName').value.trim(); PF.addr = $('#pAddr').value.trim();
  if(!(PF.name && PF.status && PF.color)) return toast('Điền tên, tình trạng và màu xe nhé');
  const first = !L.profile; L.profile = {...PF, av: (L.profile && L.profile.av) || 'car', since: L.profile?.since || Date.now()}; L.name = PF.name; saveLocal(); syncProfile();
  toast(first ? `Chào mừng ${PF.name} vào hội!` : 'Đã lưu hồ sơ');
  if(first){ S.luu = null; history.replaceState(null,'','#loi'); navDepth = 0; route(); } else back();
  return;
 }
 if(act==='dockOpen' || act==='dockClose'){ dockOpen = act==='dockOpen'; pickVer=''; const e = D.errs.find(x => x.id===location.hash.slice(5)); return e && renderDock(e); }
 if(act==='metoo' || act==='unmetoo'){
  const id = ds.id; t.disabled = true;
  let v = pickVer; if(v==='__other') v = ($('#mtOther')||{}).value?.trim() || '';
  try{
   if(online()){ await api({action:act, id, version:v}); EXTRA[id] = Math.max(0, (EXTRA[id]||0) + (act==='metoo'?1:-1)); }
   if(act==='metoo') L.metoo[id] = {v, ts:Date.now()}; else delete L.metoo[id];
   saveLocal(); toast(act==='metoo' ? '👍 Đã ghi nhận, +1 điểm' : 'Đã bỏ ghi nhận');
   dockOpen = false; renderDetail(id); refreshMe();
  }catch(err){ t.disabled = false; toast('Chưa gửi được: ' + err.message); }
  return;
 }
 if(act==='sendReport'){
  const f = { desc:$('#rDesc').value.trim(), group:DRAFT.rG||'', ctx:$('#rCtx').value.trim(), version:$('#rVer').value.trim(), tmp:$('#rTmp').value.trim() };
  if(!f.desc){ toast('Điền triệu chứng trước đã'); return $('#rDesc').focus(); }
  if(!online()) return copyOut($('#rOut'), `[Báo lỗi VF8]${f.group?' '+f.group:''}\nTriệu chứng: ${f.desc}${f.ctx?`\nXảy ra khi: ${f.ctx}`:''}${f.version?`\nPhiên bản: ${f.version}`:''}${f.tmp?`\nXử lý tạm: ${f.tmp}`:''}\nNgười báo: ${L.profile.name}`);
  t.disabled = true;
  try{ await api(Object.assign({action:'report'}, f)); DRAFT = {}; L.nRep = (L.nRep||0) + 1; saveLocal(); t.classList.add('hidden'); $('#rOut').innerHTML = `<p class="note" style="margin-top:14px">🎉 Đã gửi, +5 điểm. Người quản lý sẽ xem rồi đưa vào danh sách.</p>`; refreshMe(); }
  catch(err){ t.disabled = false; toast('Chưa gửi được: ' + err.message); }
  return;
 }
 if(act==='sendAnswer'){
  const text = $('#aText').value.trim(), q = D.qa.find(x => x.id===ds.id);
  if(!text) return toast('Điền câu trả lời trước đã');
  if(!online()) return copyOut($('#aOut'), `[Trả lời] ${q.q}\n${text}\n(${L.profile.name})`);
  t.disabled = true;
  try{ await api({action:'answer', id:q.id, question:q.q, text}); L.nAns = (L.nAns||0) + 1; saveLocal(); t.classList.add('hidden'); $('#aOut').innerHTML = `<p class="note" style="margin-top:14px">🎉 Đã gửi, +3 điểm. Câu trả lời sẽ hiện sau khi được duyệt.</p>`; refreshMe(); }
  catch(err){ t.disabled = false; toast('Chưa gửi được: ' + err.message); }
  return;
 }
 if(act==='copy') return copyText(t.parentElement._text);
});
document.addEventListener('change', async ev => {
 if(ev.target.id === 'avFile' && ev.target.files[0]){ try{ AVPICK = 'p:' + await readPhoto(ev.target.files[0]); renderAvatar(); }catch(e){ toast(e.message); } return; }
 if(ev.target.dataset.ck){ const id = ev.target.dataset.ck; if(ev.target.checked) L.check[id]=1; else delete L.check[id]; saveLocal(); renderLuu(); }
});
document.addEventListener('input', ev => {
 const id = ev.target.id;
 if(['rDesc','rCtx','rVer','rTmp'].includes(id)) DRAFT[id] = ev.target.value;
 if(id==='pName'){ PF.name = ev.target.value; $('#pSave').disabled = !(PF.name.trim() && PF.status && PF.color); }
 if(id==='rDesc'){ const ds = dupes(ev.target.value); $('#rDupes').innerHTML = ds.length ? `<div class="dupes"><b>Có thể lỗi này đã có.</b> Nếu đúng, mở ra bấm 👍 Tôi cũng bị:${ds.map(e => `<a href="#loi-${e.id}">${esc(e.desc.slice(0,80))}${e.desc.length>80?'…':''}</a>`).join('')}</div>` : ''; }
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && !$('#screen').classList.contains('hidden') && L.profile) back(); });
window.addEventListener('hashchange', route);

document.querySelectorAll('.menu [data-ic]').forEach(s => s.outerHTML = ico(s.dataset.ic));
LOADING = !D.errs.length;
prep();
if(!location.hash) try{ history.replaceState(null,'','#loi'); }catch(e){}
route(); loadServer(); if(!online()) checkLevelUp();
</script>
